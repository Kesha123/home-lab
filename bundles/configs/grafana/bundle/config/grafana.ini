[server]
root_url = https://grafana.innokentii-kozlov.com

[auth]
oauth_auto_login = true
signout_redirect_url = https://authentik.innokentii-kozlov.com/application/o/grafana/end-session/

[auth.generic_oauth]
enabled = true
name = authentik
scopes = openid profile email entitlements
auth_url = https://authentik.innokentii-kozlov.com/application/o/authorize/
token_url = https://authentik.innokentii-kozlov.com/application/o/token/
api_url = https://authentik.innokentii-kozlov.com/application/o/userinfo/
role_attribute_path = contains(entitlements[*], 'Grafana Admins') && 'Admin' || contains(entitlements[*], 'Grafana Editors') && 'Editor' || 'Viewer'

[panels]
disable_sanitize_html = true
