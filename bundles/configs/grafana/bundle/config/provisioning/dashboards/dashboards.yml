apiVersion: 1

providers:
  - name: "Automated Dashboards - Infrastructure"
    orgId: 1
    folder: "Infrastructure"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards/infrastructure

  - name: "Automated Dashboards - Hardware"
    orgId: 1
    folder: "Hardware"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards/hardware

  - name: "Automated Dashboards - Containers"
    orgId: 1
    folder: "Containers"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards/containers
