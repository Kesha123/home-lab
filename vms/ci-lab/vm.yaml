name: ci-lab
qemu-uri: qemu:///system
vcpu: 2
memory: 4096
disks:
  - path: /var/lib/libvirt/images/ci-lab/root-disk.qcow2
    device: disk
    bus: virtio
    format: qcow2
    backing_store: /var/lib/libvirt/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
    backing_format: qcow2
    size: 40
  - path: /var/lib/libvirt/images/ci-lab/cloud-init.iso
    device: cdrom
    bus: sata
    format: raw
networks:
  - bridge=br0,model=virtio,mac=52:54:00:12:34:10
graphics: none
console: pty,target_type=serial
cmd-args:
  - --import
  - --noautoconsole
  - --os-variant
  - fedora-unknown
