scrape_configs:
  - job_name: "zot-registry"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets: [zot.innokentii-kozlov.com]

  - job_name: "blocky"
    metrics_path: "/metrics"
    scheme: "https"

    static_configs:
      - targets: [blocky.innokentii-kozlov.com]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: 'dell-optiplex-3000'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "forgejo"
    static_configs:
      - targets: ["forgejo:3000"]

  - job_name: "authentik-server"
    static_configs:
      - targets: ["authentik-server:9300"]

  - job_name: "authentik-worker"
    static_configs:
      - targets: ["authentik-worker:9300"]

  - job_name: "caddy"
    static_configs:
      - targets: ["caddy:2019"]

  - job_name: "podman-exporter"
    static_configs:
      - targets: ["podman-exporter:9882"]
