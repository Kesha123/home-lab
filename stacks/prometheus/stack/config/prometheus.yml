scrape_configs:
  - job_name: "zot-registry"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets: [zot.innokentii-kozlov.com]

  - job_name: "blocky"
    metrics_path: "/metrics"
    scheme: "https"
    static_configs:
      - targets: [blocky.innokentii-kozlov.com]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: 'dell-optiplex-3000'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'raspberrypi-5'
    scheme: "https"
    static_configs:
      - targets: ['node-exporter.raspberrypi-5.innokentii-kozlov.com']

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "forgejo"
    static_configs:
      - targets: ["forgejo:3000"]

  - job_name: "authentik-server"
    static_configs:
      - targets: ["authentik-server:9300"]

  - job_name: "authentik-worker"
    static_configs:
      - targets: ["authentik-worker:9300"]

  - job_name: "caddy.dell-optiplex-3000"
    static_configs:
      - targets: ["caddy:2019"]

  - job_name: "caddy.raspberrypi-5"
    scheme: "https"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["caddy-exporter.raspberrypi-5.innokentii-kozlov.com"]

  - job_name: "podman-exporter.dell-optiplex-3000"
    static_configs:
      - targets: ["podman-exporter:9882"]

  - job_name: "podman-exporter.raspberrypi-5"
    scheme: "https"
    static_configs:
      - targets: ["podman-exporter.raspberrypi-5.innokentii-kozlov.com"]
