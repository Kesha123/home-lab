---
- name: Ensure certs directory exists
  ansible.builtin.file:
    path: "{{ certs_dir }}"
    state: directory
    mode: '0755'

- name: Generate CA private key
  ansible.builtin.command:
    cmd: openssl genrsa -out {{ certs_dir }}/ca.key 4096
    creates: "{{ certs_dir }}/ca.key"

- name: Generate CA certificate
  ansible.builtin.command:
    cmd: >-
      openssl req -new -x509 -days {{ postgres_cert_validity_days }}
      -key {{ certs_dir }}/ca.key
      -out {{ certs_dir }}/ca.crt
      -subj "/C={{ postgres_cert_country }}/O={{ postgres_cert_organization }}/CN=ci-lab-postgres-ca"
    creates: "{{ certs_dir }}/ca.crt"

- name: Generate server private key
  ansible.builtin.command:
    cmd: openssl genrsa -out {{ certs_dir }}/server.key 2048
    creates: "{{ certs_dir }}/server.key"

- name: Generate server CSR
  ansible.builtin.command:
    cmd: >-
      openssl req -new
      -key {{ certs_dir }}/server.key
      -out {{ certs_dir }}/server.csr
      -subj "/C={{ postgres_cert_country }}/O={{ postgres_cert_organization }}/CN={{ postgres_cert_common_name }}"
    creates: "{{ certs_dir }}/server.csr"

- name: Sign server certificate with CA
  ansible.builtin.command:
    cmd: >-
      openssl x509 -req -days {{ postgres_cert_validity_days }}
      -in {{ certs_dir }}/server.csr
      -CA {{ certs_dir }}/ca.crt
      -CAkey {{ certs_dir }}/ca.key
      -CAcreateserial
      -out {{ certs_dir }}/server.crt
    creates: "{{ certs_dir }}/server.crt"

- name: Set permissions on cert files
  ansible.builtin.file:
    path: "{{ certs_dir }}/{{ item.path }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: ca.crt, mode: '0644' }
    - { path: ca.key, mode: '0600' }
    - { path: server.crt, mode: '0644' }
    - { path: server.key, mode: '0644' }
    - { path: server.csr, mode: '0644' }
