---
- name: Ensure stack directory exists
  ansible.builtin.file:
    path: "{{ stack_dir }}"
    state: directory
    mode: '0755'

- name: Pull stack artifact from zot
  ansible.builtin.command:
    cmd: podman artifact pull {{ artifact_ref }}

- name: Extract artifact tarball to temp location
  ansible.builtin.command:
    cmd: podman artifact extract {{ artifact_ref }} /tmp/stack.tar.gz
    creates: /tmp/stack.tar.gz

- name: Unpack stack tarball to stack directory
  ansible.builtin.unarchive:
    src: /tmp/stack.tar.gz
    dest: "{{ stack_dir }}"
    remote_src: true
    creates: "{{ stack_dir }}/compose.yaml"

- name: Remove temp tarball
  ansible.builtin.file:
    path: /tmp/stack.tar.gz
    state: absent
